services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jubis
      POSTGRES_USER: jubis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jubis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jubis -d jubis"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  jubis_data:
